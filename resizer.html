<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Govt Scheme Photo Resizer (Dummy)</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; text-align: center; }
        .box { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        img { max-width: 100%; margin-top: 15px; border: 1px solid #ddd; }
        button { background: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0056b3; }
        .success { background: #28a745; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Photo Resizer (40KB - 100KB)</h2>
        <p>100% Safe & Offline (No Server Upload)</p>
        
        <input type="file" id="uploadInput" accept="image/*"><br><br>
        <button onclick="processImage()">Resize Image</button>

        <div id="result" style="display:none; margin-top: 20px;">
            <h3 style="color: #28a745;">Success!</h3>
            <p id="sizeInfo" style="font-weight: bold;"></p>
            <img id="outputImg">
            <br>
            <a id="downloadLink" download="resized_document.jpg">
                <button class="success">Download Photo</button>
            </a>
        </div>
    </div>

    <script>
        function processImage() {
            const fileInput = document.getElementById('uploadInput');
            if (!fileInput.files[0]) {
                alert("দয়া করে প্রথমে একটি ছবি সিলেক্ট করুন!");
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);

                    let quality = 0.9;
                    const maxBytes = 100 * 1024; // 100 KB
                    const minBytes = 40 * 1024;  // 40 KB

                    // Recursive function to reduce quality until it fits
                    function compress() {
                        canvas.toBlob(function(blob) {
                            if (blob.size > maxBytes && quality > 0.1) {
                                quality -= 0.1; // কোয়ালিটি কমাচ্ছে
                                compress();
                            } else {
                                showResult(blob);
                            }
                        }, 'image/jpeg', quality);
                    }
                    compress();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function showResult(blob) {
            const url = URL.createObjectURL(blob);
            document.getElementById('outputImg').src = url;
            document.getElementById('downloadLink').href = url;
            
            const kbSize = (blob.size / 1024).toFixed(2);
            document.getElementById('sizeInfo').innerText = "New Size: " + kbSize + " KB";
            document.getElementById('result').style.display = "block";
        }
    </script>
</body>
</html>
