<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Govt. Document Resizer - Pro</title>
    <!-- Tailwind CSS for Professional Design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Heic2Any Library -->
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
    <style>
        /* Custom animations */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4 font-sans text-gray-800">

    <div class="max-w-lg w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
        
        <!-- Header Section -->
        <div class="bg-blue-600 p-6 text-center">
            <h1 class="text-2xl font-bold text-white mb-2">Smart Photo Resizer</h1>
            <p class="text-blue-100 text-sm">Perfect for Govt. Forms (40KB - 100KB)</p>
            <span class="inline-block mt-2 px-3 py-1 bg-blue-500 text-xs text-white rounded-full font-medium">100% Safe • Processed Offline</span>
        </div>

        <div class="p-8">
            <!-- Upload Area -->
            <div id="uploadArea" class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center hover:border-blue-500 hover:bg-blue-50 transition-all cursor-pointer relative" onclick="document.getElementById('uploadInput').click()">
                <svg class="mx-auto h-12 w-12 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                <p class="text-gray-600 font-medium text-lg">Click to Upload or Drag & Drop</p>
                <p class="text-gray-400 text-sm mt-1">Supports JPG, PNG, HEIC</p>
                <input type="file" id="uploadInput" accept="image/*" class="hidden" onchange="handleProcess()">
            </div>

            <!-- Progress Section (Hidden initially) -->
            <div id="progressSection" class="hidden mt-6 fade-in">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-sm font-semibold text-blue-600" id="progressStatus">Processing image...</span>
                    <span class="text-sm font-bold text-gray-700" id="progressPercent">0%</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2.5">
                    <div id="progressBar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>

            <!-- Result Section (Hidden initially) -->
            <div id="resultSection" class="hidden mt-8 text-center fade-in">
                <div class="bg-green-50 border border-green-200 rounded-xl p-6">
                    <div class="flex justify-center mb-3">
                        <svg class="w-10 h-10 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <h3 class="text-xl font-bold text-gray-800 mb-1">Compression Successful!</h3>
                    <p class="text-gray-500 text-sm mb-4">Your file is ready to upload.</p>
                    
                    <div class="inline-block bg-white border border-gray-200 rounded-lg px-4 py-2 mb-6 shadow-sm">
                        <span class="text-gray-500 text-sm">New File Size:</span>
                        <span id="sizeInfo" class="ml-2 font-bold text-lg text-green-600"></span>
                    </div>

                    <!-- Output Image Preview -->
                    <div class="mb-6 flex justify-center">
                        <img id="outputImg" class="max-h-48 rounded-lg border border-gray-200 shadow-sm object-contain" alt="Compressed Preview">
                    </div>

                    <a id="downloadLink" download="resized_document.jpg" class="w-full block">
                        <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition duration-200 flex items-center justify-center gap-2 shadow-lg shadow-blue-200">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            Download Document
                        </button>
                    </a>
                </div>
                
                <button onclick="resetApp()" class="mt-4 text-gray-500 hover:text-gray-700 text-sm font-medium underline">
                    Compress another photo
                </button>
            </div>

        </div>
    </div>

    <script>
        // UI Control Functions
        const uploadArea = document.getElementById('uploadArea');
        const progressSection = document.getElementById('progressSection');
        const resultSection = document.getElementById('resultSection');
        const progressBar = document.getElementById('progressBar');
        const progressPercent = document.getElementById('progressPercent');
        const progressStatus = document.getElementById('progressStatus');

        function resetApp() {
            document.getElementById('uploadInput').value = '';
            uploadArea.classList.remove('hidden');
            progressSection.classList.add('hidden');
            resultSection.classList.add('hidden');
            progressBar.style.width = '0%';
            progressPercent.innerText = '0%';
        }

        // Simulate progress for better UX
        function animateProgress(start, end, duration, statusText) {
            return new Promise(resolve => {
                progressStatus.innerText = statusText;
                let current = start;
                const increment = (end - start) / (duration / 30);
                const timer = setInterval(() => {
                    current += increment;
                    if (current >= end) {
                        current = end;
                        clearInterval(timer);
                        resolve();
                    }
                    progressBar.style.width = `${current}%`;
                    progressPercent.innerText = `${Math.round(current)}%`;
                }, 30);
            });
        }

        async function handleProcess() {
            const fileInput = document.getElementById('uploadInput');
            if (!fileInput.files[0]) return;

            let file = fileInput.files[0];
            
            // UI Switch
            uploadArea.classList.add('hidden');
            progressSection.classList.remove('hidden');
            resultSection.classList.add('hidden');

            try {
                // Step 1: Check and Convert HEIC if needed
                if (file.name.toLowerCase().endsWith(".heic") || file.name.toLowerCase().endsWith(".heif")) {
                    await animateProgress(0, 30, 800, "Converting Apple format...");
                    const convertedBlob = await heic2any({ blob: file, toType: "image/jpeg" });
                    file = new File([convertedBlob], file.name.replace(/\.[^/.]+$/, ".jpg"), { type: "image/jpeg" });
                    await animateProgress(30, 50, 500, "Preparing to resize...");
                } else {
                    await animateProgress(0, 50, 600, "Reading image data...");
                }

                // Step 2: Resize Logic
                await animateProgress(50, 85, 1000, "Optimizing file size (40-100KB)...");
                
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const MAX_SIZE = 1200; 
                        let width = img.width;
                        let height = img.height;

                        if (width > MAX_SIZE || height > MAX_SIZE) {
                            if (width > height) {
                                height = Math.round((height * MAX_SIZE) / width);
                                width = MAX_SIZE;
                            } else {
                                width = Math.round((width * MAX_SIZE) / height);
                                height = MAX_SIZE;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);

                        let quality = 0.9;
                        const maxBytes = 100 * 1024;
                        const minBytes = 40 * 1024;

                        function compress() {
                            canvas.toBlob(function(blob) {
                                if (blob.size > maxBytes && quality > 0.1) {
                                    quality -= 0.05; // Finer adjustment
                                    compress();
                                } else {
                                    finishProcess(blob);
                                }
                            }, 'image/jpeg', quality);
                        }
                        compress();
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);

            } catch (error) {
                alert("Something went wrong processing the image. Please try another one.");
                resetApp();
            }
        }

        async function finishProcess(blob) {
            await animateProgress(85, 100, 300, "Finalizing...");
            
            setTimeout(() => {
                progressSection.classList.add('hidden');
                
                const url = URL.createObjectURL(blob);
                document.getElementById('outputImg').src = url;
                document.getElementById('downloadLink').href = url;
                document.getElementById('sizeInfo').innerText = (blob.size / 1024).toFixed(2) + " KB";
                
                resultSection.classList.remove('hidden');
            }, 500);
        }
    </script>
</body>
</html>
