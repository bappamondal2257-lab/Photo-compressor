<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Govt Scheme Photo Resizer (Pro Dummy)</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; text-align: center; }
        .box { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        img { max-width: 100%; margin-top: 15px; border: 1px solid #ddd; border-radius: 5px; }
        button { background: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; font-size: 16px; }
        button:hover { background: #0056b3; }
        .success { background: #28a745; margin-top: 15px; }
        .success:hover { background: #218838; }
        #processingMsg { color: #d39e00; font-weight: bold; margin-top: 15px; display: none; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Photo Resizer (40KB - 100KB)</h2>
        <p style="color: #666; font-size: 14px;">Perfect for Govt. Forms | 100% Offline</p>
        
        <input type="file" id="uploadInput" accept="image/*" style="margin-top: 15px;"><br><br>
        <button onclick="processImage()">Resize Image</button>

        <p id="processingMsg">Processing large image... Please wait ⏳</p>

        <div id="result" style="display:none; margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px;">
            <h3 style="color: #28a745; margin: 5px 0;">Success!</h3>
            <p id="sizeInfo" style="font-weight: bold; font-size: 18px; color: #333; margin: 5px 0;"></p>
            <img id="outputImg">
            <br>
            <a id="downloadLink" download="resized_document.jpg">
                <button class="success">Download Photo</button>
            </a>
        </div>
    </div>

    <script>
        function processImage() {
            const fileInput = document.getElementById('uploadInput');
            if (!fileInput.files[0]) {
                alert("দয়া করে প্রথমে একটি ছবি সিলেক্ট করুন!");
                return;
            }

            // Show processing state
            document.getElementById('processingMsg').style.display = "block";
            document.getElementById('result').style.display = "none";

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // Step 1: Resize physical dimensions for large files
                    const MAX_SIZE = 1200; // Standard document size
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_SIZE || height > MAX_SIZE) {
                        if (width > height) {
                            height = Math.round((height * MAX_SIZE) / width);
                            width = MAX_SIZE;
                        } else {
                            width = Math.round((width * MAX_SIZE) / height);
                            height = MAX_SIZE;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);

                    // Step 2: Compress to target KB
                    let quality = 0.9;
                    const maxBytes = 100 * 1024; // 100 KB
                    let scaleFactor = 1.0;

                    function compress() {
                        canvas.toBlob(function(blob) {
                            if (blob.size > maxBytes) {
                                if (quality > 0.3) {
                                    quality -= 0.1; // Reduce quality
                                    compress();
                                } else {
                                    // If quality is low but size is still big, shrink dimensions further
                                    scaleFactor -= 0.1;
                                    const newWidth = Math.round(width * scaleFactor);
                                    const newHeight = Math.round(height * scaleFactor);
                                    
                                    canvas.width = newWidth;
                                    canvas.height = newHeight;
                                    ctx.drawImage(img, 0, 0, newWidth, newHeight);
                                    
                                    quality = 0.7; // Reset quality for the new smaller size
                                    compress();
                                }
                            } else {
                                showResult(blob);
                            }
                        }, 'image/jpeg', quality);
                    }
                    compress();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function showResult(blob) {
            document.getElementById('processingMsg').style.display = "none";
            
            const url = URL.createObjectURL(blob);
            document.getElementById('outputImg').src = url;
            document.getElementById('downloadLink').href = url;
            
            const kbSize = (blob.size / 1024).toFixed(2);
            document.getElementById('sizeInfo').innerText = "New Size: " + kbSize + " KB";
            document.getElementById('result').style.display = "block";
        }
    </script>
</body>
</html>
