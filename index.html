<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Govt Scheme Photo Resizer (Pro)</title>
    <!-- Heic2Any লাইব্রেরি যোগ করা হলো -->
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; text-align: center; }
        .box { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        img { max-width: 100%; margin-top: 15px; border: 1px solid #ddd; border-radius: 5px; }
        button { background: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; font-size: 16px; }
        button:hover { background: #0056b3; }
        .success { background: #28a745; margin-top: 15px; }
        #processingMsg { color: #d39e00; font-weight: bold; margin-top: 15px; display: none; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Photo Resizer</h2>
        <p style="color: #666; font-size: 14px;">Supports HEIC, JPG, PNG | 100% Offline</p>
        
        <input type="file" id="uploadInput" accept="image/*" style="margin-top: 15px;"><br><br>
        <button onclick="handleProcess()">Resize Image</button>

        <p id="processingMsg">Processing... (Converting & Resizing) ⏳</p>

        <div id="result" style="display:none; margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px;">
            <h3 style="color: #28a745; margin: 5px 0;">Success!</h3>
            <p id="sizeInfo" style="font-weight: bold; font-size: 18px; color: #333; margin: 5px 0;"></p>
            <img id="outputImg">
            <br>
            <a id="downloadLink" download="resized_document.jpg">
                <button class="success">Download Photo</button>
            </a>
        </div>
    </div>

    <script>
        async function handleProcess() {
            const fileInput = document.getElementById('uploadInput');
            if (!fileInput.files[0]) {
                alert("দয়া করে প্রথমে একটি ছবি সিলেক্ট করুন!");
                return;
            }

            document.getElementById('processingMsg').style.display = "block";
            document.getElementById('result').style.display = "none";

            let file = fileInput.files[0];

            // HEIC চেক এবং কনভার্ট করা
            if (file.name.toLowerCase().endsWith(".heic") || file.name.toLowerCase().endsWith(".heif")) {
                try {
                    const convertedBlob = await heic2any({ blob: file, toType: "image/jpeg" });
                    file = new File([convertedBlob], file.name.replace(/\.[^/.]+$/, ".jpg"), { type: "image/jpeg" });
                } catch (e) {
                    alert("HEIC ফাইল কনভার্ট করা সম্ভব হয়নি।");
                    document.getElementById('processingMsg').style.display = "none";
                    return;
                }
            }

            // আগের রিসাইজিং লজিক
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const MAX_SIZE = 1200; 
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_SIZE || height > MAX_SIZE) {
                        if (width > height) {
                            height = Math.round((height * MAX_SIZE) / width);
                            width = MAX_SIZE;
                        } else {
                            width = Math.round((width * MAX_SIZE) / height);
                            height = MAX_SIZE;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);

                    let quality = 0.9;
                    const maxBytes = 100 * 1024;

                    function compress() {
                        canvas.toBlob(function(blob) {
                            if (blob.size > maxBytes && quality > 0.1) {
                                quality -= 0.1;
                                compress();
                            } else {
                                showResult(blob);
                            }
                        }, 'image/jpeg', quality);
                    }
                    compress();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function showResult(blob) {
            document.getElementById('processingMsg').style.display = "none";
            const url = URL.createObjectURL(blob);
            document.getElementById('outputImg').src = url;
            document.getElementById('downloadLink').href = url;
            document.getElementById('sizeInfo').innerText = "New Size: " + (blob.size / 1024).toFixed(2) + " KB";
            document.getElementById('result').style.display = "block";
        }
    </script>
</body>
</html>
